name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontmatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - name: SKILL.md frontmatter has name and description
        run: |
          python - <<'PY'
          import re, yaml
          t = open("SKILL.md").read()
          m = re.match(r"^---\n(.*?)\n---", t, re.S)
          assert m, "SKILL.md has no frontmatter"
          d = yaml.safe_load(m.group(1))
          assert {"name", "description"} <= set(d), d
          assert d["name"] == "claude-model-router", d["name"]
          print("frontmatter OK")
          PY
